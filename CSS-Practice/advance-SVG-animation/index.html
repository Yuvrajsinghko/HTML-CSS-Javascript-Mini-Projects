    <svg width="0" height="0">
      <defs>
        <filter id="wavy" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence
            type="turbulence"
            numOctaves="3"
            seed="3"
            baseFrequency="0 0.02"
            result="noise"
          >
            <animate
              attributeName="baseFrequency"
              dur="6s"
              values="0 0.01; 0 0.03; 0 0.01"
              repeatCount="indefinite"
            />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" />
        </filter>
      </defs>
    </svg>

    <h1 style="filter: url(#wavy); font-size: 60px; color:brown">liquid text</h1>
